<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>illuminairy · Q1 · Real branded directions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=DM+Sans:ital,wght@0,400..800;1,400..800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #E8E2D6; }
    body { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }

    :root {
      --au-bg:        #F5F8FA;
      --au-bg-sage:   #E8EFEA;   /* very subtle sage tint */
      --au-bg-warm:   #F1F3EF;   /* warm polar */
      --au-card:      #FFFFFF;
      --au-ink:       #121A2B;
      --au-ink-2:     #2A3142;
      --au-ink-mid:   #4D5566;
      --au-ink-mute:  #8A8E97;
      --au-line:      rgba(18, 26, 43, 0.06);
      --au-line-2:    rgba(18, 26, 43, 0.18);
      --au-aurora:    #2F6E47;
      --au-aurora-mid:#3E8B5A;
      --au-aurora-glow: #77C89A;
      --au-aurora-soft: #E5EFE8;
      --au-celestial: #0057A8;
    }

    .br {
      height: 100%; width: 100%;
      display: flex; flex-direction: column;
      overflow: hidden;
      background: var(--au-bg);
      color: var(--au-ink);
      box-sizing: border-box;
      position: relative;
    }
    .br *, .br *::before, .br *::after { box-sizing: border-box; }

    /* ════════════════════════════════════════════════════════════════
       VARIANT 1 — EDITORIAL FOLIO
       Big "01" folio number as visual anchor. Lettered option cards.
       Aurora hairline rule. Headline is a quiet typographic moment.
       ════════════════════════════════════════════════════════════════ */
    .br.v1 {
      background: var(--au-bg);
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
    }
    .br.v1 .top {
      flex: 0 0 auto;
      padding: 60px 24px 0;
      position: relative;
      z-index: 2;
    }
    .br.v1 .top-row {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 18px;
    }
    .br.v1 .back {
      width: 30px; height: 30px;
      background: transparent; border: none; cursor: pointer;
      margin-left: -8px;
      color: var(--au-ink-mid);
      font-size: 20px;
    }
    .br.v1 .wordmark {
      font-family: 'Schibsted Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--au-ink);
    }
    .br.v1 .step {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--au-ink-mute);
    }
    .br.v1 .step b { color: var(--au-aurora); font-weight: 500; }
    .br.v1 .progress {
      height: 5px; background: rgba(18,26,43,0.06);
      border-radius: 999px; overflow: hidden;
    }
    .br.v1 .progress .fill {
      height: 100%; width: 4.3%;
      background: var(--au-aurora-mid); border-radius: 999px;
    }
    .br.v1 .body { flex: 1; overflow-y: auto; padding: 56px 24px 32px; }

    /* the moment: oversized folio + question */
    .br.v1 .folio-row {
      display: grid; grid-template-columns: auto 1fr; gap: 18px;
      align-items: end;
      padding: 32px 0 12px;
    }
    .br.v1 .folio {
      font-family: 'Fraunces', serif;
      font-weight: 200;
      font-size: 96px;
      line-height: 0.85;
      color: var(--au-aurora);
      letter-spacing: -0.04em;
      font-variation-settings: 'opsz' 144;
      font-style: italic;
    }
    .br.v1 .folio-meta {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--au-ink-mute);
      text-transform: uppercase;
      padding-bottom: 6px;
    }
    .br.v1 .h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 32px;
      line-height: 1.08;
      letter-spacing: -0.022em;
      color: var(--au-ink);
      margin: 0;
      font-variation-settings: 'opsz' 72;
      text-wrap: balance;
      padding: 14px 0 16px;
    }
    .br.v1 .h1 em {
      font-style: normal;
      color: var(--au-aurora);
      font-weight: 500;
    }
    .br.v1 .sub {
      font-size: 14px; line-height: 1.5;
      color: var(--au-ink-mid);
      margin: 0 0 22px;
      font-weight: 400;
      max-width: 320px;
    }
    .br.v1 .rule {
      height: 1px; width: 64px;
      background: var(--au-aurora-mid);
      margin-bottom: 24px;
    }
    .br.v1 .opts { display: flex; flex-direction: column; }
    .br.v1 .opt {
      appearance: none; background: transparent; border: none;
      cursor: pointer; text-align: left;
      display: grid; grid-template-columns: 30px 1fr 18px; gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid rgba(18,26,43,0.08);
      font-family: inherit;
      align-items: center;
      transition: background 0.12s;
    }
    .br.v1 .opt:first-child { border-top: 1px solid rgba(18,26,43,0.08); }
    .br.v1 .opt .letter {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--au-ink-mute);
      font-weight: 500;
    }
    .br.v1 .opt .label {
      font-size: 15px; font-weight: 500; color: var(--au-ink);
      line-height: 1.35;
    }
    .br.v1 .opt .chev { color: var(--au-ink-mute); font-size: 14px; }
    .br.v1 .opt.selected {
      margin: 0 -24px; padding: 18px 24px;
      background: var(--au-aurora-soft);
      border-left: 3px solid var(--au-aurora);
    }
    .br.v1 .opt.selected .letter { color: var(--au-aurora); }
    .br.v1 .opt.selected .chev { color: var(--au-aurora); }
    .br.v1 .opt-out {
      display: inline-block;
      margin-top: 26px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--au-aurora);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      cursor: pointer;
      background: none; border: none; padding: 0;
    }

    /* ════════════════════════════════════════════════════════════════
       VARIANT 2 — FLOATING PAPER
       Sage-tinted PAGE with a white "paper" sheet floating above.
       The sheet is the content. Brand mark dot in the sheet corner.
       ════════════════════════════════════════════════════════════════ */
    .br.v2 {
      background: var(--au-bg-sage);
      font-family: 'Schibsted Grotesk', sans-serif;
      padding: 60px 20px 24px;
    }
    .br.v2 .sheet {
      flex: 1;
      background: var(--au-card);
      border-radius: 24px;
      box-shadow:
        0 1px 2px rgba(18,26,43,0.04),
        0 12px 36px -16px rgba(32,80,64,0.18),
        0 32px 80px -32px rgba(32,80,64,0.12);
      padding: 24px 22px 24px;
      display: flex; flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .br.v2 .sheet::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 3px;
      background: linear-gradient(to right,
        var(--au-aurora-mid),
        var(--au-aurora-glow),
        var(--au-celestial));
      border-radius: 0 0 999px 999px;
    }
    .br.v2 .sheet-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .br.v2 .back {
      width: 30px; height: 30px;
      background: transparent; border: none; cursor: pointer;
      margin-left: -8px;
      color: var(--au-ink-mid); font-size: 20px;
    }
    .br.v2 .mark {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Schibsted Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--au-ink);
    }
    .br.v2 .mark .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--au-aurora-glow), var(--au-aurora));
      box-shadow: 0 0 16px rgba(119,200,154,0.8);
    }
    .br.v2 .step {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--au-ink-mute);
    }
    .br.v2 .step b { color: var(--au-aurora); font-weight: 500; }
    .br.v2 .progress {
      height: 5px; background: rgba(18,26,43,0.06);
      border-radius: 999px; overflow: hidden; margin-bottom: 32px;
    }
    .br.v2 .progress .fill {
      height: 100%; width: 4.3%;
      background: var(--au-aurora-mid); border-radius: 999px;
    }
    .br.v2 .h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--au-ink);
      margin: 0 0 28px;
      font-variation-settings: 'opsz' 72;
      text-wrap: balance;
    }
    .br.v2 .h1 em {
      font-style: normal;
      color: var(--au-aurora);
      font-weight: 500;
    }
    .br.v2 .sub {
      font-size: 14px; line-height: 1.5;
      color: var(--au-ink-mid);
      margin: -18px 0 24px;
      font-weight: 400;
      max-width: 320px;
    }
    .br.v2 .opts {
      display: flex; flex-direction: column; gap: 8px;
      overflow-y: auto;
    }
    .br.v2 .opt {
      appearance: none;
      background: var(--au-bg-warm);
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 16px 18px;
      min-height: 62px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 14.5px; font-weight: 500;
      color: var(--au-ink);
      line-height: 1.35;
      transition: background 0.12s, border-color 0.12s;
    }
    .br.v2 .opt:hover { border-color: var(--au-aurora); }
    .br.v2 .opt.selected {
      background: var(--au-aurora-soft);
      border-color: var(--au-aurora);
    }
    .br.v2 .opt-out {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--au-aurora);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      cursor: pointer;
      background: none; border: none; padding: 4px;
    }

    /* ════════════════════════════════════════════════════════════════
       VARIANT 3 — AURORA HERO BAND
       Top ~40% of screen is a navy-to-aurora gradient hero containing
       the question. Brand mark glows in the corner. White card list
       below sits against the polar bg.
       ════════════════════════════════════════════════════════════════ */
    .br.v3 {
      background: var(--au-bg-sage);
      font-family: 'Schibsted Grotesk', sans-serif;
    }
    .br.v3 .hero {
      flex: 0 0 auto;
      background: var(--au-ink);
      padding: 60px 26px 40px;
      color: #F5F8FA;
      position: relative;
      overflow: hidden;
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
    }
    .br.v3 .hero::before {
      content: '';
      position: absolute;
      top: -160px; right: -120px;
      width: 460px; height: 460px;
      background: radial-gradient(circle,
        rgba(119, 200, 154, 0.45) 0%,
        rgba(0, 87, 168, 0.22) 32%,
        transparent 64%);
      pointer-events: none;
      filter: blur(2px);
    }
    .br.v3 .hero::after {
      content: '';
      position: absolute;
      bottom: -120px; left: -80px;
      width: 320px; height: 320px;
      background: radial-gradient(circle,
        rgba(184, 245, 209, 0.22) 0%,
        transparent 60%);
      pointer-events: none;
    }
    .br.v3 .hero > * { position: relative; z-index: 1; }
    .br.v3 .top-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .br.v3 .back {
      width: 30px; height: 30px;
      background: transparent; border: none; cursor: pointer;
      margin-left: -8px;
      color: rgba(245,248,250,0.65); font-size: 20px;
    }
    .br.v3 .mark {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Schibsted Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #F5F8FA;
    }
    .br.v3 .mark .star {
      width: 8px; height: 8px;
      background: var(--au-aurora-glow);
      border-radius: 50%;
      box-shadow:
        0 0 16px rgba(119,200,154,0.9),
        0 0 32px rgba(119,200,154,0.5);
    }
    .br.v3 .step {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: rgba(245,248,250,0.55);
    }
    .br.v3 .step b { color: var(--au-aurora-glow); font-weight: 500; }
    .br.v3 .progress {
      height: 5px; background: rgba(245,248,250,0.10);
      border-radius: 999px; overflow: hidden;
      margin-bottom: 36px;
    }
    .br.v3 .progress .fill {
      height: 100%; width: 4.3%;
      background: var(--au-aurora-glow); border-radius: 999px;
      box-shadow: 0 0 12px rgba(119,200,154,0.6);
    }
    .br.v3 .h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: -0.022em;
      font-variation-settings: 'opsz' 72;
      color: #F5F8FA;
      margin: 0;
      text-wrap: balance;
    }
    .br.v3 .h1 em {
      font-style: normal;
      color: var(--au-aurora-glow);
      font-weight: 500;
    }
    .br.v3 .sub {
      font-size: 14px; line-height: 1.55;
      color: rgba(245,248,250,0.75);
      margin: 14px 0 0;
      font-weight: 400;
      max-width: 320px;
    }
    .br.v3 .opts-wrap {
      flex: 1; overflow-y: auto;
      padding: 28px 22px 28px;
      background: var(--au-bg);
    }
    .br.v3 .opts {
      display: flex; flex-direction: column; gap: 10px;
    }
    .br.v3 .opt {
      appearance: none;
      background: var(--au-card);
      border: 1px solid var(--au-line);
      border-radius: 14px;
      padding: 18px 20px;
      min-height: 64px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 14.5px; font-weight: 500;
      color: var(--au-ink);
      line-height: 1.35;
      transition: background 0.12s, border-color 0.12s, transform 0.05s;
    }
    .br.v3 .opt:hover { border-color: var(--au-aurora); }
    .br.v3 .opt.selected {
      background: var(--au-aurora-soft);
      border-color: var(--au-aurora);
      box-shadow:
        0 1px 2px rgba(32,80,64,0.06),
        0 12px 28px -14px rgba(32,80,64,0.3);
    }
    .br.v3 .opt-out {
      display: block;
      margin: 20px auto 0;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--au-aurora);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      cursor: pointer;
      background: none; border: none; padding: 4px;
    }

    /* ═════════════════════════════════════════════════════════════
       VARIANT 3b — COMPACT HERO
       Only the chrome (wordmark + progress) lives in the dark navy
       band. Question moves down to share bg with the option cards.
       More vertical room. Better thumb conversion. Same brand identity.
       ═════════════════════════════════════════════════════════════ */
    .br.v3b {
      background: var(--au-bg);
      font-family: 'Schibsted Grotesk', sans-serif;
    }
    .br.v3b .band {
      flex: 0 0 auto;
      background: var(--au-ink);
      padding: 60px 26px 22px;
      color: #F5F8FA;
      position: relative;
      overflow: hidden;
    }
    .br.v3b .band::before {
      content: '';
      position: absolute;
      top: -120px; right: -80px;
      width: 320px; height: 320px;
      background: radial-gradient(circle,
        rgba(119, 200, 154, 0.40) 0%,
        rgba(0, 87, 168, 0.20) 32%,
        transparent 64%);
      pointer-events: none;
    }
    .br.v3b .band > * { position: relative; z-index: 1; }
    .br.v3b .top-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .br.v3b .back {
      width: 30px; height: 30px;
      background: transparent; border: none; cursor: pointer;
      margin-left: -8px;
      color: rgba(245,248,250,0.65); font-size: 20px;
    }
    .br.v3b .mark {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Schibsted Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #F5F8FA;
    }
    .br.v3b .mark .star {
      width: 8px; height: 8px;
      background: var(--au-aurora-glow);
      border-radius: 50%;
      box-shadow:
        0 0 16px rgba(119,200,154,0.9),
        0 0 32px rgba(119,200,154,0.5);
    }
    .br.v3b .progress {
      height: 5px; background: rgba(245,248,250,0.10);
      border-radius: 999px; overflow: hidden;
    }
    .br.v3b .progress .fill {
      height: 100%; width: 4.3%;
      background: var(--au-aurora-glow); border-radius: 999px;
      box-shadow: 0 0 12px rgba(119,200,154,0.6);
    }
    .br.v3b .content {
      flex: 1; overflow-y: auto;
      padding: 48px 24px 32px;
      display: flex; flex-direction: column;
    }
    .br.v3b .h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -0.022em;
      font-variation-settings: 'opsz' 72;
      color: var(--au-ink);
      margin: 0 0 32px;
      text-wrap: balance;
    }
    .br.v3b .h1 em {
      font-style: normal;
      color: var(--au-aurora);
      font-weight: 500;
    }
    .br.v3b .opts {
      display: flex; flex-direction: column; gap: 10px;
    }
    .br.v3b .opt {
      appearance: none;
      background: var(--au-card);
      border: 1px solid var(--au-line);
      border-radius: 14px;
      padding: 18px 20px;
      min-height: 64px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 14.5px; font-weight: 500;
      color: var(--au-ink);
      line-height: 1.35;
      transition: background 0.12s, border-color 0.12s, transform 0.05s;
    }
    .br.v3b .opt:active { transform: translateY(1px); }
    .br.v3b .opt:hover { border-color: var(--au-aurora); }
    .br.v3b .opt.selected {
      background: var(--au-aurora-soft);
      border-color: var(--au-aurora);
      box-shadow:
        0 1px 2px rgba(32,80,64,0.06),
        0 8px 20px -12px rgba(32,80,64,0.28);
    }
    .br.v3b .opt-out {
      display: block;
      margin: 20px auto 0;
      text-align: center;
      font-family: 'Schibsted Grotesk', sans-serif;
      font-size: 13px;
      color: var(--au-aurora);
      text-decoration: underline;
      text-decoration-thickness: 1px;

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const W = 402;
    const H = 874;

    const OPTIONS = [
      { id: 'score-low', label: "Our SAT score was too low" },
      { id: 'test-soon', label: "SAT test date is coming up" },
      { id: 'app-soon',  label: "App deadlines are almost here" },
      { id: 'gpa-sat',   label: "Good grades, low SAT — why?" },
      { id: 'get-ahead', label: "We want to get ahead early" },
    ];

    function V1Folio() {
      return (
        <div className="br v1">
          <div className="top">
            <div className="top-row">
              <button className="back">←</button>
              <div className="wordmark">illuminairy</div>
              <div style={{ width: 30 }} />
            </div>
            <div className="progress"><div className="fill" /></div>
          </div>
          <div className="body">
            <h1 className="h1" dangerouslySetInnerHTML={{
              __html: "Which sounds <em>most like you</em>?"
            }} />
            <div className="rule" />
            <div className="opts">
              {OPTIONS.map((o, i) => (
                <button key={o.id} className={"opt" + (i === 0 ? ' selected' : '')}>
                  <span className="letter">{String.fromCharCode(65 + i)}</span>
                  <span className="label">{o.label}</span>
                  <span className="chev">→</span>
                </button>
              ))}
            </div>
            <button className="opt-out">None of these — help me figure it out</button>
          </div>
        </div>
      );
    }

    function V2Paper() {
      return (
        <div className="br v2">
          <div className="sheet">
            <div className="sheet-top">
              <button className="back">←</button>
              <div className="mark"><span className="dot" />illuminairy</div>
              <div style={{ width: 30 }} />

            <div className="progress"><div className="fill" /></div>
            <h1 className="h1" dangerouslySetInnerHTML={{
              __html: "Which sounds <em>most like you</em>?"

                  {o.label}

            </div>
            <button className="opt-out">None of these — help me figure it out</button>
          </div>
        </div>

    function V3Hero() {
      return (
        <div className="br v3">
          <div className="hero">
            <div className="top-row">
              <button className="back">←</button>
              <div className="mark"><span className="star" />illuminairy</div>
              <div style={{ width: 30 }} />
            </div>
            <div className="progress"><div className="fill" /></div>
            <h1 className="h1" dangerouslySetInnerHTML={{
              __html: "Which sounds <em>most like you</em>?"
            }} />
          </div>
          <div className="opts-wrap">
            <div className="opts">
              {OPTIONS.map((o, i) => (
                <button key={o.id} className={"opt" + (i === 0 ? ' selected' : '')}>
                  {o.label}
                </button>
              ))}
            </div>
            <button className="opt-out">None of these — help me figure it out</button>
          </div>
        </div>
      );
    }

    function V3bCompact() {
      return (
        <div className="br v3b">
          <div className="band">
            <div className="top-row">
              <button className="back">←</button>
              <div className="mark"><span className="star" />illuminairy</div>
              <div style={{ width: 30 }} />
            </div>
            <div className="progress"><div className="fill" /></div>
          </div>
          <div className="content">
            <h1 className="h1" dangerouslySetInnerHTML={{
              __html: "Which sounds <em>most like you</em>?"
            }} />
            <div className="opts">
              {OPTIONS.map((o, i) => (
                <button key={o.id} className={"opt" + (i === 0 ? ' selected' : '')}>

                </button>
              ))}
            </div>
            <button className="opt-out">None of these — help me figure it out</button>
          </div>
        </div>

    function PhoneSlot({ children }) {
      return (
        <div style={{ width: W, height: H, background: '#000' }}>
          <IOSDevice width={W} height={H}>{children}</IOSDevice>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="final"
            title="V2 vs V3 vs V3b compact"
            subtitle="V2 floating paper · V3 big hero · V3b compact hero (chrome stays dark, question + options share light bg). V3b gives more vertical room without losing the brand chrome moment."
          >
            <DCArtboard id="v2" label="V2 · Floating paper" width={W} height={H}>
              <PhoneSlot><V2Paper /></PhoneSlot>
            </DCArtboard>
            <DCArtboard id="v3" label="V3 · Aurora hero (full)" width={W} height={H}>
              <PhoneSlot><V3Hero /></PhoneSlot>
            </DCArtboard>
            <DCArtboard id="v3b" label="V3b · Aurora compact — question on light bg" width={W} height={H}>
              <PhoneSlot><V3bCompact /></PhoneSlot>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
