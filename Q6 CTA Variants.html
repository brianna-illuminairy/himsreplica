<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>illuminairy · Q6 CTA variants</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Schibsted+Grotesk:wght@400..900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="quiz-funnel.css" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ECF1ED; }
    body { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }

    /* ── Variant overrides for the bottom CTA region ─────────── */

    /* B · Solid ink with selected count */
    .v-b .qf-btn {
      background: var(--qf-ink);
      color: var(--qf-paper);
    }
    .v-b .qf-btn:hover { background: #1B2436; }
    .v-b .qf-btn .count {
      display: inline-block;
      margin-right: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(245, 248, 250, 0.16);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--qf-glow);
      font-weight: 500;
      vertical-align: 1px;
    }

    /* C · Elevated bottom bar — count above button */
    .v-c .qf-footer {
      background: var(--qf-paper);
      box-shadow: 0 -8px 24px -12px rgba(18, 26, 43, 0.15);
      border-top: none;
      padding-bottom: 30px;
    }
    .v-c .footer-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0 14px;
    }
    .v-c .footer-row .count-text {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--qf-forest);
      font-weight: 500;
      text-transform: uppercase;
    }
    .v-c .footer-row .clear {
      font-family: 'Schibsted Grotesk', sans-serif;
      font-size: 12px;
      color: var(--qf-ink-mid);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      background: none; border: none; cursor: pointer; padding: 0;
    }

    /* D · Ghost outline + emphasis count */
    .v-d .qf-btn {
      background: transparent;
      color: var(--qf-ink);
      border: 1.5px solid var(--qf-ink);
      box-shadow: none;
    }
    .v-d .qf-btn:hover {
      background: var(--qf-ink);
      color: var(--qf-paper);
    }
    .v-d .count-strip {
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.24em;
      color: var(--qf-forest);
      font-weight: 500;
      text-transform: uppercase;
      padding-bottom: 14px;
    }

    /* E · Two-button: skip + continue. Demonstrates the "I don't know" escape */
    .v-e .footer-two {
      display: grid; grid-template-columns: auto 1fr; gap: 10px;
    }
    .v-e .qf-btn { padding-left: 16px; padding-right: 16px; }
    .v-e .ghost-btn {
      appearance: none; border: 1.5px solid var(--qf-line-2);
      background: transparent;
      color: var(--qf-ink-mid);
      border-radius: 999px;
      padding: 0 22px;
      min-height: 56px;
      font-family: 'Schibsted Grotesk', sans-serif;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .v-e .ghost-btn:hover { border-color: var(--qf-ink); color: var(--qf-ink); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="quiz-funnel-shell.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const W = 402;
    const H = 874;

    const OPTIONS = [
      { id: 'math',       label: 'Math' },
      { id: 'reading',    label: 'Reading & writing' },
      { id: 'self-study', label: "Self-study isn't working" },
      { id: 'wont',       label: "Won't study on their own" },
      { id: 'no-plan',    label: 'No clear plan' },
      { id: 'too-busy',   label: 'Too busy' },
    ];

    // Render Q6 with a custom footer slot per variant.
    function Q6({ variantClass, footer, selected = ['no-plan', 'wont'] }) {
      return (
        <div className={"variant-wrap " + variantClass}>
          <QFScreen stepIdx={6} footer={footer}>
            <QFQuestionHead title="What seems to be the <em>problem</em>?" />
            <div className="qf-multi-hint">Select all that apply</div>
            <div className="qf-options">
              {OPTIONS.map(o => (
                <QFOption key={o.id}
                  multi
                  selected={selected.includes(o.id)}
                >{o.label}</QFOption>
              ))}
            </div>
          </QFScreen>
        </div>
      );
    }

    // ── Variant A · Current ─────────────────────────────────────
    const FooterA = (
      <QFButton kind="forest">Continue</QFButton>
    );

    // ── Variant B · Ink solid + count badge ─────────────────────
    const FooterB = (
      <button className="qf-btn">
        <span className="count">2</span>
        Continue
        <span className="arrow">→</span>
      </button>
    );

    // ── Variant C · Elevated bar with count line + clear ────────
    const FooterC = (
      <>
        <div className="footer-row">
          <span className="count-text">● 2 selected</span>
          <button className="clear">Clear</button>
        </div>
        <QFButton kind="forest">Continue</QFButton>
      </>
    );

    // ── Variant D · Ghost outline + small count strip ───────────
    const FooterD = (
      <>
        <div className="count-strip">2 selected</div>
        <button className="qf-btn">
          Continue
          <span className="arrow">→</span>
        </button>
      </>
    );

    // ── Variant E · Skip + Continue (two-button) ────────────────
    const FooterE = (
      <div className="footer-two">
        <button className="ghost-btn">Skip</button>
        <QFButton kind="forest">Continue · 2 selected</QFButton>
      </div>
    );

    function PhoneSlot({ children }) {
      return (
        <div style={{ width: W, height: H, background: '#000' }}>
          <IOSDevice width={W} height={H}>{children}</IOSDevice>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="cta"
            title="Q6 · CTA variants"
            subtitle="Same screen, 5 button treatments. Variant choice affects: how obvious 'this is multi-select' is, how the count surfaces, and whether we offer escape (skip) before commit."
          >
            <DCArtboard id="a" label="A · Aurora pill (current)" width={W} height={H}>
              <PhoneSlot><Q6 variantClass="v-a" footer={FooterA} /></PhoneSlot>
            </DCArtboard>
            <DCArtboard id="b" label="B · Ink pill + count badge" width={W} height={H}>
              <PhoneSlot><Q6 variantClass="v-b" footer={FooterB} /></PhoneSlot>
            </DCArtboard>
            <DCArtboard id="c" label="C · Elevated bar · count + clear above" width={W} height={H}>
              <PhoneSlot><Q6 variantClass="v-c" footer={FooterC} /></PhoneSlot>
            </DCArtboard>
            <DCArtboard id="d" label="D · Ghost outline + count strip" width={W} height={H}>
              <PhoneSlot><Q6 variantClass="v-d" footer={FooterD} /></PhoneSlot>
            </DCArtboard>
            <DCArtboard id="e" label="E · Skip + Continue · 2 buttons" width={W} height={H}>
              <PhoneSlot><Q6 variantClass="v-e" footer={FooterE} /></PhoneSlot>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
