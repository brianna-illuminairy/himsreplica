<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>illuminairy · SAT Quiz Funnel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Schibsted+Grotesk:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="quiz-funnel.css" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #E8E2D6; }
    body { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Framework -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Funnel components -->
  <script type="text/babel" src="quiz-funnel-shell.jsx"></script>
  <script type="text/babel" src="quiz-funnel-questions.jsx"></script>
  <script type="text/babel" src="quiz-funnel-interstitials.jsx"></script>
  <script type="text/babel" src="quiz-funnel-results.jsx"></script>
  <script type="text/babel" src="quiz-funnel-finale.jsx"></script>

  <!-- App -->
  <script type="text/babel" data-presets="env,react">
    const { useState } = React;
    const W = 402;
    const H = 874;

    function PhoneSlot({ children }) {
      return (
        <div style={{ width: W, height: H, background: '#000' }}>
          <IOSDevice width={W} height={H}>{children}</IOSDevice>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Funnel sections — grouped by phase for the canvas.
    // ─────────────────────────────────────────────────────────
    const SECTIONS = [
      {
        id: 'ab-q2',
        title: 'A/B test · Q2 · Stakes vs Goals',
        subtitle: 'Same psychological lift, opposite emotional valence. A asks "What would you lose?" — visceral, threat-anchoring. B asks "What\'s your biggest goal?" — aspirational, outcome-anchoring. Pick one for the live funnel; replace Phase 1\'s Q2 to swap.',
        screens: [
          { id: 'q2-a', label: 'A · Stakes · "What would you lose?"',  C: () => <QFQ2Stakes /> },
          { id: 'q2-b', label: 'B · Goal   · "Biggest goal here?"',    C: () => <QFQ2Aspiration /> },
        ],
      },
      {
        id: 'q7-grammar',
        title: 'Screen 08 · grammar check per Q3 answer',
        subtitle: 'If they\'ve taken the SAT, the headline anchors on their last attempt. If not, it asks broadly. Same option list either way.',
        screens: [
          { id: 'q7-sat',  label: 'Q3 = SAT once/twice/3+ → "last SAT"', C: () => <QFQ7Tried q3="sat-1" /> },
          { id: 'q7-none', label: 'Q3 = PSAT only / None → "so far"',     C: () => <QFQ7Tried q3="none" /> },
        ],
      },
      {
        id: 'i1-grammar',
        title: 'Screen 06 · grammar check per Q2 answer',
        subtitle: 'The "so that ___" predicate is dynamic. Each variant below shows what Line 1 reads as when the user picked that Q2 option. All read naturally with Oct 3 test date.',
        screens: [
          { id: 'i1-tc',   label: 'Q2 = top-choice school',          C: () => <QFI1Proof q2="top-choice" /> },
          { id: 'i1-mer',  label: 'Q2 = merit scholarships',         C: () => <QFI1Proof q2="merit" /> },
          { id: 'i1-sel',  label: 'Q2 = selective colleges',         C: () => <QFI1Proof q2="selective" /> },
          { id: 'i1-app',  label: 'Q2-A = missing early app rounds', C: () => <QFI1Proof q2="app-rounds" /> },
          { id: 'i1-ear',  label: 'Q2-B = strengthen early apps',    C: () => <QFI1Proof q2="early" /> },
        ],
      },
      {
        id: 'phase-1',
        title: 'Phase 1 · The easy 5',
        subtitle: '5 thumb-friendly taps to build sunk cost. Q1 (trigger) + Q2 (stakes) get the parent emotionally bought in; Q3–Q5 collect the basics.',
        screens: [
          { id: 'q1', label: '01 · Trigger',     C: () => <QFQ1Trigger /> },
          { id: 'q2', label: '02 · Stakes',      C: () => <QFQ2Stakes /> },
          { id: 'q3', label: '03 · Times taken', C: () => <QFQ3TimesTaken /> },
          { id: 'q4', label: '04 · Recent score',C: () => <QFQ4RecentScore /> },
          { id: 'q5', label: '05 · Clock',       C: () => <QFQ5Clock /> },
        ],
      },
      {
        id: 'phase-2',
        title: 'Phase 2 · Proof beat + 2 more',
        subtitle: 'First emotional payoff after 5 easy taps. Then problem diagnosis (multi) + prior prep (multi).',
        screens: [
          { id: 'i1', label: '06 · Proof interstitial', C: () => <QFI1Proof /> },
          { id: 'q6', label: '07 · Blocker',            C: () => <QFQ6Blocker /> },
          { id: 'q7', label: '08 · Tried',              C: () => <QFQ7Tried /> },
          { id: 'i-diag',     label: '09a · Diagnosis · paragraphs',  C: () => <QFIDiagnosis /> },
          { id: 'i-diag-rep', label: '09b · Diagnosis · report variant', C: () => <QFIDiagnosisReport /> },
        ],
      },
      {
        id: 'phase-3',
        title: 'Phase 3 · Compute + Goal + Method + GPA',
        subtitle: 'Compute screen synthesizes Q3–Q7 inputs in dark mode (the only dark screen in the funnel). Hands off to Goal as the "missing input". Then Method (RCA) explains how we work, then last data ask: GPA.',
        screens: [
          { id: 'i2', label: '09 · Compute · building your plan', C: () => <QFI2Compute /> },
          { id: 'q8', label: '10 · Goal',                       C: () => <QFQ8Goal /> },
          { id: 'i3', label: '11 · Score Projection · preview',    C: () => <QFI3Bridge /> },
          { id: 'q9', label: '12 · GPA',                        C: () => <QFQ9GPA /> },
        ],
      },
      {
        id: 'phase-4',
        title: 'Phase 4 · The reveal',
        subtitle: 'GPA gap reframe (high GPA + low SAT) → projected score chart → summary of inputs.',
        screens: [
          { id: 'i-gap', label: '13a · GPA Gap · school vs SAT habits', C: () => <QFIGPAGap /> },
          { id: 'v1', label: '14 · Score projection',  C: () => <QFV1Projection /> },
          { id: 's1', label: '15 · Summary of inputs', C: () => <QFS1Summary /> },
        ],
      },
      {
        id: 'phase-5',
        title: 'Phase 5 · Proof block',
        subtitle: 'Our method → the stats backing it → who the tutors are. Three premium full screens.',
        screens: [
          { id: 's2', label: '15 · Our method · 4 steps', C: () => <QFS2Science /> },
          { id: 's3', label: '16 · Stats · 4.5× the avg', C: () => <QFS3Stats /> },
          { id: 's4', label: '17 · Authority · tutors',   C: () => <QFS4Authority /> },
        ],
      },
      {
        id: 'phase-6',
        title: 'Phase 6 · Convert',
        subtitle: 'Approved + create account (first typed input, after all sunk cost). Pick a plan. See plan details + social proof. Acknowledgment + book the call.',
        screens: [
          { id: 's5', label: '18 · Approved + account', C: () => <QFS5Approved /> },
          { id: 's6', label: '19 · Plan preference',    C: () => <QFS6Preference /> },
          { id: 's7', label: '20 · Plan details',       C: () => <QFS7PlanDetails /> },
          { id: 's8', label: '21 · Acknowledgment',     C: () => <QFS8Acknowledgment /> },
          { id: 's9', label: '22 · Book the call',      C: () => <QFS9Booking /> },
        ],
      },
    ];

    function App() {
      return (
        <DesignCanvas>
          {SECTIONS.map(s => (
            <DCSection key={s.id} id={s.id} title={s.title} subtitle={s.subtitle}>
              {s.screens.map(scr => (
                <DCArtboard key={scr.id} id={scr.id} label={scr.label} width={W} height={H}>
                  <PhoneSlot><scr.C /></PhoneSlot>
                </DCArtboard>
              ))}
            </DCSection>
          ))}
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
